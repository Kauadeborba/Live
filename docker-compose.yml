services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: live
      POSTGRES_PASSWORD: live
      POSTGRES_DB: live
    ports:
      - "5433:5432"
    volumes:
      - live-db:/var/lib/postgresql/data
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  live-db:
